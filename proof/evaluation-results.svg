<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" fill="#0b1118" rx="18"/><text x="50" y="75" fill="#ffffff" font-family="Arial,sans-serif" font-size="34" font-weight="700">ScamShield — Evaluation Evidence</text><text x="50" y="135" fill="#ffffff" font-family="Arial,sans-serif" font-size="23">Development benchmark: 30 labeled cases</text><text x="50" y="195" fill="#ffffff" font-family="Arial,sans-serif" font-size="23">Cases completed: 29 / 30</text><text x="50" y="245" fill="#ffcc66" font-family="Arial,sans-serif" font-size="28">Risk-level accuracy: 51.7%</text><text x="50" y="295" fill="#ffcc66" font-family="Arial,sans-serif" font-size="28">Category accuracy: 65.5%</text><text x="50" y="345" fill="#ffcc66" font-family="Arial,sans-serif" font-size="28">Exact match accuracy: 34.5%</text><text x="50" y="405" fill="#ffffff" font-family="Arial,sans-serif" font-size="20">One case returned HTTP 500 and was excluded from</text><text x="50" y="435" fill="#ffffff" font-family="Arial,sans-serif" font-size="20">the completed-case denominator.</text><text x="50" y="500" fill="#9aa7b5" font-family="Arial,sans-serif" font-size="18">Results are reported as-is from the live deployment.</text><text x="50" y="535" fill="#9aa7b5" font-family="Arial,sans-serif" font-size="16">This is a development benchmark, not a production accuracy claim.</text></svg>